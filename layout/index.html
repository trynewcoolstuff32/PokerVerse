<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokerVerse - Start</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PokerVerse</h1>
    <p>Scrum Poker für unser Team</p>
  </header>

  <main>

    <!-- Name eingeben -->
    <section class="box">
      <h2>Wie heisst du?</h2>
      <input type="text" placeholder="Dein Name" value="Anna">
      <p class="fehler">Bitte gib einen Namen ein.</p>
      <a class="knopf" href="pokertisch.html">Neue Runde erstellen</a>
    </section>

    <!-- Offene Runden -->
    <section class="box">
      <h2>Offene Runden</h2>

      <div class="runde">
        <a href="pokertisch.html">Runde 4821</a>
        <span>3 Spieler</span>
        <button class="knopf rot">Löschen</button>
      </div>

      <div class="runde">
        <a href="pokertisch.html">Runde 1337</a>
        <span>1 Spieler</span>
        <button class="knopf rot">Löschen</button>
      </div>

      <div class="runde">
        <a href="pokertisch.html">Runde 7070</a>
        <span>5 Spieler</span>
        <button class="knopf rot">Löschen</button>
      </div>
    </section>

  </main>

  <footer>
    <p>Web Technology Projekt</p>
  </footer>

</body>
</html>
