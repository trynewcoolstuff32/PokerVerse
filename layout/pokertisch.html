<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokerVerse - Pokertisch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PokerVerse</h1>
  </header>

  <main>

    <div class="oben">
      <h2>Runde 4821</h2>
      <p>Du bist: Anna</p>
      <a class="knopf rot" href="index.html">Verlassen</a>
    </div>

    <!-- Welche Karten -->
    <div class="knoepfe">
      <button class="knopf aktiv">Fibonacci</button>
      <button class="knopf">T-Shirt</button>
    </div>

    <!-- Der Tisch -->
    <section class="tisch">
      <div class="spieler">
        <div class="karte verdeckt">?</div>
        <p>Anna</p>
      </div>
      <div class="spieler">
        <div class="karte verdeckt">?</div>
        <p>Ben</p>
      </div>
      <div class="spieler">
        <div class="karte leer">...</div>
        <p>Carla</p>
      </div>
    </section>

    <div class="knoepfe">
      <a class="knopf" href="aufgedeckt.html">Aufdecken</a>
      <button class="knopf">Neue Runde</button>
    </div>

    <!-- Meine Karten -->
    <section class="box">
      <h2>Wähle eine Karte</h2>
      <div class="deck">
        <div class="karte">1</div>
        <div class="karte">2</div>
        <div class="karte">3</div>
        <div class="karte gewaehlt">5</div>
        <div class="karte">8</div>
        <div class="karte">13</div>
        <div class="karte">21</div>
        <div class="karte">?</div>
      </div>
    </section>

  </main>

</body>
</html>
